services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - PORT=5000
      - HOST=0.0.0.0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-120}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-ollama}
      - GEMINI_ENABLED=${GEMINI_ENABLED:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_MODELS=${GEMINI_MODELS:-gemini-2.5-flash,gemini-2.5-pro}
      - HISTORY_BACKEND_TYPE=${HISTORY_BACKEND_TYPE:-local}
      - HISTORY_DB_PATH=/app/data/chat_history.db
      - HISTORY_REDIS_URL=${HISTORY_REDIS_URL:-redis://redis:6379/0}
      - AUTH_ENABLED=${AUTH_ENABLED:-True}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - AUTH_USERS_FILE=/app/data/users.json
      - NOMINATIM_VERIFY_SSL=${NOMINATIM_VERIFY_SSL:-false}
      # Local sample SQLite database exposed to the agent's database_query tool.
      - DB_CONNECTOR_1_NAME=${DB_CONNECTOR_1_NAME:-sample}
      - DB_CONNECTOR_1_TYPE=${DB_CONNECTOR_1_TYPE:-sqlite}
      - DB_CONNECTOR_1_URL=${DB_CONNECTOR_1_URL:-sqlite:///app/sample-db/sample.db}
    volumes:
      - backend-data:/app/data
      - sqlite-data:/app/sample-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlite-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One-shot service: seeds a sample SQLite database into the shared volume.
  # SQLite is file-based, so there is no long-running database daemon — this
  # container creates ./db/sample-init.sql into /data/sample.db and exits.
  sqlite-init:
    image: alpine:3.20
    volumes:
      - sqlite-data:/data
      - ./db/sample-init.sql:/init/sample-init.sql:ro
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache sqlite >/dev/null
        if [ ! -f /data/sample.db ]; then
          sqlite3 /data/sample.db < /init/sample-init.sql
          echo "Seeded /data/sample.db"
        else
          echo "/data/sample.db already exists — skipping seed"
        fi
    restart: "no"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_API_TIMEOUT=${VITE_API_TIMEOUT:-30000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  backend-data:
  redis-data:
  sqlite-data:
 